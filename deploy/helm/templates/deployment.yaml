{{- include "openokr.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openokr.fullname" . }}
  labels:
    {{- include "openokr.labels" . | nindent 4 }}
spec:
  {{- if not (include "openokr.autoscaling" .) }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "openokr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "openokr.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openokr.serviceAccountName" . }}
      # The pause, the drain and 15 seconds for the flushes (plan 0.8.0 H10b).
      # Derived rather than a value of its own, so it cannot be shorter than
      # what it has to cover.
      terminationGracePeriodSeconds: {{ include "openokr.terminationGraceSeconds" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- if gt (include "openokr.preStopSeconds" . | int) 0 }}
          # Keeps answering while the endpoint change travels to kube-proxy,
          # the ingress controller or a cloud load balancer, which still send
          # requests for a few seconds after the pod is marked for deletion.
          # Without it a rollout fails those requests (plan 0.8.0 H10b). `exec`
          # with `sleep` rather than the native sleep action, which Kubernetes
          # 1.27, the chart's floor, may not have.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ include "openokr.preStopSeconds" . }}"]
          {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "openokr.serverEnv" . | nindent 12 }}
            {{- if include "openokr.workerEnabled" . }}
            # The worker Deployment runs both (plan 0.8.0 H10e). `elsewhere`
            # rather than `off`, so the copilot keeps its background runs and
            # /api/status judges the stamp the worker's scheduler writes.
            - name: OPENOKR_RELAY
              value: "elsewhere"
            - name: OPENOKR_SCHEDULER
              value: "elsewhere"
            {{- end }}
          # Ready means the database answers, not merely that the port is open.
          # A pod that is listening but cannot reach Postgres must not receive
          # traffic during a rollout.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Deliberately more forgiving than readiness. A database blip should
          # take a pod out of the load balancer, not restart it: restarting
          # helps nothing and turns a brief outage into a crash loop.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only, so anything the process writes
            # needs a mount of its own.
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/apps/web/.next/cache
            - name: storage
              mountPath: /app/storage
            {{- with (include "openokr.dbCaMount" .) }}
            {{- . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-storage" (include "openokr.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with (include "openokr.dbCaVolume" .) }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
