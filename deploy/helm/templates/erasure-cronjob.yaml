{{- /* `cloud` is absent from values reused from a release older than 0.6 (helm upgrade --reuse-values). */ -}}
{{- $cloud := .Values.cloud | default dict }}
{{- $erasure := $cloud.erasure | default dict }}
{{- if $erasure.schedule }}
{{- include "openokr.validate" . -}}
# Erasing closed workspaces once their retention window has passed
# (docs/design/workspace-erasure.md §7).
#
# Off until a schedule is set, and even then nothing is erased while
# cloud.closureRetentionDays (OPENOKR_CLOUD_CLOSURE_RETENTION_DAYS) is 0. It runs
# with the same owner role as the migration job, because only the owner role may
# delete a workspace's audit rows; the application's pods never hold it. The
# application must be running: it deletes the files and the payment customer when
# the erasure asks, because only it holds those drivers.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "openokr.fullname" . }}-erase
  labels:
    {{- include "openokr.labels" . | nindent 4 }}
    app.kubernetes.io/component: erasure
spec:
  schedule: {{ $erasure.schedule | quote }}
  # Two runs at once would wait on each other's advisory lock, and the second
  # would find nothing to do. Forbid says so in the schedule instead.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retry: a failed workspace keeps its progress, the next scheduled run
      # resumes it, and the failed Job's log says why in the meantime.
      backoffLimit: 0
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            {{- include "openokr.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: erasure
        spec:
          restartPolicy: Never
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Talks to Postgres and to nothing else, like the migration job.
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: erase
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              command:
                - node
                - --experimental-strip-types
                - --no-warnings
                - ./migrator/packages/core/src/bin/cloud-erase.ts
                - --write
              workingDir: /app
              env:
                {{- include "openokr.commonEnv" . | nindent 16 }}
                # The command loads the server's whole environment, which in
                # production refuses to start without the real auth secret.
                # Without this every run stopped on "BETTER_AUTH_SECRET: is
                # still the development placeholder" and nothing was ever
                # erased (plan 0.8.0 O3). The job already holds the owner
                # role, so this secret adds little to what it can reach.
                - name: BETTER_AUTH_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "openokr.secretName" . }}
                      key: {{ .Values.secrets.authSecretKey | default "better-auth-secret" }}
              resources:
                {{- toYaml .Values.migrationResources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                {{- with (include "openokr.dbCaMount" .) }}
                {{- . | nindent 16 }}
                {{- end }}
          volumes:
            - name: tmp
              emptyDir: {}
            {{- with (include "openokr.dbCaVolume" .) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
