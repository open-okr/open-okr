{{- if .Values.backup.enabled }}
{{- include "openokr.validate" . -}}
{{- $filesOnVolume := and .Values.persistence.enabled (not .Values.storage.s3.bucket) }}
# Scheduled encrypted backup (P6-T06).
#
# pg_dump custom format, encrypted with the instance's root key, and a
# SHA-256 checksum. The volume mount is where the backups land; an operator
# points it at a PVC or an NFS mount.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "openokr.fullname" . }}-backup
  labels:
    {{- include "openokr.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.historyLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.backup.historyLimit | default 3 }}
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            {{- include "openokr.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          {{- if and $filesOnVolume (eq .Values.persistence.accessMode "ReadWriteOnce") }}
          # A ReadWriteOnce volume mounts on one node at a time, so the backup
          # runs beside the application that holds it. The application's pods
          # carry the selector labels and no component; the backup's own pod
          # carries `backup`, so it cannot be its own anchor.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      {{- include "openokr.selectorLabels" . | nindent 22 }}
                    matchExpressions:
                      - key: app.kubernetes.io/component
                        operator: DoesNotExist
          {{- end }}
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              image: postgres:17-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
                  BACKUP_DIR="/backups/$TIMESTAMP"
                  mkdir -p "$BACKUP_DIR"

                  # The owner's address when there is one: a role under
                  # forced row-level security cannot dump the tables it holds.
                  DB_URL="${DATABASE_ADMIN_URL:-$DATABASE_URL}"

                  echo "backup: dumping database..."
                  pg_dump "$DB_URL" -Fc > "$BACKUP_DIR/db.dump"

                  echo "backup: encrypting..."
                  apk add --no-cache openssl >/dev/null 2>&1 || true
                  openssl enc -aes-256-cbc -salt -pbkdf2 \
                    -pass "pass:$OPENOKR_ENCRYPTION_KEY" \
                    -in "$BACKUP_DIR/db.dump" \
                    -out "$BACKUP_DIR/db.dump.enc"
                  rm -f "$BACKUP_DIR/db.dump"

                  DB_SIZE="$(wc -c < "$BACKUP_DIR/db.dump.enc" | tr -d ' ')"

                  # The uploaded files, when they live on the chart's own
                  # volume (H-19). In object storage they are the bucket's to
                  # keep, with the provider's versioning or replication.
                  {{- if $filesOnVolume }}
                  echo "backup: archiving files..."
                  tar -C /storage -cf - . | openssl enc -aes-256-cbc -salt -pbkdf2 \
                    -pass "pass:$OPENOKR_ENCRYPTION_KEY" \
                    -out "$BACKUP_DIR/blobs.tar.enc"
                  FILES="blobs.tar.enc"
                  {{- else }}
                  echo "backup: files are in object storage; back up the bucket there."
                  FILES=""
                  {{- end }}

                  cat > "$BACKUP_DIR/manifest.json" <<MANIFEST
                  {"timestamp":"$TIMESTAMP","dbBytes":$DB_SIZE,"files":"${FILES:-object-storage}","format":"openokr-backup-v1"}
                  MANIFEST

                  (cd "$BACKUP_DIR" && sha256sum db.dump.enc manifest.json $FILES > checksum.sha256)

                  # Retention
                  KEPT=0
                  for D in $(ls -1dr /backups/*/); do
                    KEPT=$((KEPT + 1))
                    if [ "$KEPT" -gt "{{ .Values.backup.retention | default 7 }}" ]; then
                      echo "backup: removing old $D"
                      rm -rf "$D"
                    fi
                  done

                  echo "backup: complete ($BACKUP_DIR, $DB_SIZE bytes)"
              # The chart's own helper, so the job reads the Secrets the chart
              # creates (completeness review H-19). It named a Secret called
              # after the release, which does not exist, and every backup
              # failed before it started.
              env:
                {{- include "openokr.commonEnv" . | nindent 16 }}
              volumeMounts:
                - name: backups
                  mountPath: /backups
                {{- if $filesOnVolume }}
                - name: storage
                  mountPath: /storage
                  readOnly: true
                {{- end }}
          volumes:
            - name: backups
              {{- if .Values.backup.existingClaim }}
              persistentVolumeClaim:
                claimName: {{ .Values.backup.existingClaim }}
              {{- else }}
              emptyDir: {}
              {{- end }}
            {{- if $filesOnVolume }}
            - name: storage
              persistentVolumeClaim:
                claimName: {{ printf "%s-storage" (include "openokr.fullname" .) }}
            {{- end }}
{{- end }}
