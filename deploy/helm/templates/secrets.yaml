{{- include "openokr.validate" . -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "openokr.fullname" .) }}
  labels:
    {{- include "openokr.labels" . | nindent 4 }}
  annotations:
    # Helm would delete this on uninstall and generate new values on the next
    # install, which would orphan every stored credential in a database the
    # operator kept. Keeping it makes reinstalling over an existing database
    # work, and makes deleting it a deliberate act.
    helm.sh/resource-policy: keep
    # A hook, and earlier than the migration job, because Helm runs every
    # pre-install hook before it creates any normal resource. A Secret that
    # was only a normal resource would not exist when the hook that needs it
    # runs, and the first install would fail on a missing secret.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    # The value survives regardless: the template reads the existing Secret
    # before this is replaced, so an upgrade re-emits the same key.
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  # Read back from the cluster on upgrade, so `helm upgrade` never rotates
  # either of these. See openokr.keepSecret.
  # Signs session cookies. Any sufficiently long secret does.
  {{ .Values.secrets.authSecretKey }}: {{ include "openokr.keepSecret" (dict "ctx" . "key" .Values.secrets.authSecretKey "value" (randAlphaNum 48)) }}
  # Wraps every stored credential, and must be base64 of exactly 32 bytes.
  # randBytes returns that; randAlphaNum would return 32 characters, which
  # decodes to 24 bytes and is refused at boot.
  {{ .Values.secrets.encryptionKeyKey }}: {{ include "openokr.keepSecret" (dict "ctx" . "key" .Values.secrets.encryptionKeyKey "value" (randBytes 32)) }}
{{- end }}
{{- if not .Values.database.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-database" (include "openokr.fullname" .) }}
  labels:
    {{- include "openokr.labels" . | nindent 4 }}
  annotations:
    # Same reason as above: the migration hook needs this before the chart's
    # normal resources are created.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  # From values, so it is at least kept out of the pod spec. An existing
  # Secret is better: a value passed to Helm is stored in the release and
  # readable with `helm get values`.
  database-url: {{ .Values.database.url | quote }}
  {{- if .Values.database.adminUrl }}
  database-admin-url: {{ .Values.database.adminUrl | quote }}
  {{- end }}
{{- end }}
