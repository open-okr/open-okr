{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openokr.serviceAccountName" . }}
  labels:
    {{- include "openokr.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The application talks to Postgres, not to Kubernetes. A mounted API token
# would be a credential with no purpose and a blast radius.
automountServiceAccountToken: false
{{- end }}
