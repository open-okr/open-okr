{{- /* With the autoscaler on, its floor decides (plan 0.8.0 H10f): a PDB over one pod blocks every node drain. */ -}}
{{- if and .Values.podDisruptionBudget.enabled (gt (include "openokr.fewestWebReplicas" . | int) 1) -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "openokr.fullname" . }}
  labels:
    {{- include "openokr.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "openokr.selectorLabels" . | nindent 6 }}
{{- end }}
