# OpenOKR chart values.
#
# One value is required and has no default: the database. Everything else
# resolves, because a chart that needs a page of configuration before it will
# start is a chart nobody installs twice.
#
#   helm install openokr ./deploy/helm \
#     --set database.url='postgres://user:pass@host:5432/openokr'

image:
  repository: ghcr.io/open-okr/open-okr
  # Empty means the chart's appVersion. Pin this in production: customers pin
  # versions and nothing is force-upgraded.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# How many application pods. Migrations run in a hook rather than on pod boot,
# and the migration runner takes a Postgres advisory lock, so more than one is
# safe from the first install.
#
# One by default, and that changed on 7 September 2026. It was two, with
# persistence off, which is the one combination that loses data quietly: the
# storage mount falls back to an emptyDir, so an uploaded file lands on
# whichever pod served the request, is missing from the other, and is gone when
# either restarts. Nobody sees an error. The gap audit recorded it as B-11.
#
# Scaling out is one flag once storage is shared: a ReadWriteMany class, or
# S3-compatible object storage. See the storage section below.
replicaCount: 1

database:
  # Required. postgres:// or postgresql://, reachable from the cluster.
  # Prefer existingSecret over this: a URL set here lands in the release's
  # stored values, which anyone with `helm get values` can read.
  url: ""
  # A Secret holding the connection string. Takes precedence over url.
  existingSecret: ""
  existingSecretKey: "database-url"
  # Optional owner-role connection used only by the migration hook, so the
  # application role never owns the tables.
  adminUrl: ""

# The instance's public origin. Passkeys are bound to it, so it must be the
# address people actually use. Defaults to the first ingress host when unset.
publicUrl: ""

secrets:
  # A Secret holding BETTER_AUTH_SECRET and OPENOKR_ENCRYPTION_KEY. When empty,
  # the chart generates both on first install and reads them back on upgrade,
  # so an upgrade never rotates a key underneath stored data.
  existingSecret: ""
  authSecretKey: "better-auth-secret"
  encryptionKeyKey: "encryption-key"

# Instance settings. Every one has a working default; these bootstrap an
# instance and are overridden by anything set later in the product.
instance:
  name: "OpenOKR"
  language: "en"
  telemetry: false
  # auto | open | invite_only
  registration: "auto"

mail:
  # console writes mail to the log and needs no server, which is why a fresh
  # instance works with none of this set.
  transport: "console"
  host: ""
  port: 587
  secure: false
  user: ""
  from: "openokr@localhost"
  # A Secret holding the SMTP password. Never put the password in values.
  existingSecret: ""
  existingSecretKey: "mail-password"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: openokr.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Applied to the migration hook as well, which needs less.
migrationResources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# File storage for the local-disk driver, which is the only storage driver
# this build has.
#
# On by default since 7 September 2026. Off was the previous default and it
# meant every upload went to an emptyDir: lost on restart, invisible to a
# sibling pod, with nothing anywhere saying so. A volume that keeps files is
# the only defensible shipped default for a driver that writes to disk.
#
# A ReadWriteOnce volume cannot be shared across nodes, so it pins the release
# to one replica and the chart refuses the combination rather than corrupting
# uploads quietly. To scale out, give it a ReadWriteMany storage class.
#
# Turning this off is a real choice for an instance that accepts no uploads or
# treats them as disposable. It is not refused, and NOTES.txt says plainly what
# it costs.
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# S3-compatible object storage (P6-G05). The way to run several replicas
# without a ReadWriteMany class: object storage is shared by definition.
#
# Naming a bucket is the whole switch. Leave it empty and the local-disk volume
# above is used, which is the default and all a self-hosted install needs.
# Works with AWS S3, MinIO, Ceph, Garage, Cloudflare R2, Backblaze B2 and
# DigitalOcean Spaces: set `endpoint` for anything that is not AWS.
storage:
  s3:
    bucket: ""
    # Required by the AWS SDK even for services that ignore it.
    region: "us-east-1"
    # A compatible service's own endpoint. Empty means AWS S3 itself.
    endpoint: ""
    # Path-style addressing, "on" or "off". Empty lets the driver decide: on
    # when an endpoint is set, off for AWS. Almost every compatible service
    # wants it on, and a virtual-host request to one resolves to a hostname
    # that does not exist.
    forcePathStyle: ""
    # Prefix every object key, so one bucket can hold several instances.
    keyPrefix: ""
    # A Secret holding the credentials. Required when a bucket is named:
    # putting a key in values would store it in the release, where anyone with
    # `helm get values` can read it. Same rule as database.existingSecret.
    existingSecret: ""
    accessKeyIdKey: "access-key-id"
    secretAccessKeyKey: "secret-access-key"

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# Defaults are restrictive. The image runs as uid 1001 and writes only to its
# storage mount and /tmp.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Keeps the deployment available during a rolling update and a node drain.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
