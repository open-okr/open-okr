# OpenOKR chart values.
#
# One value is required and has no default: the database. Everything else
# resolves, because a chart that needs a page of configuration before it will
# start is a chart nobody installs twice.
#
#   helm install openokr ./deploy/helm \
#     --set database.url='postgres://user:pass@host:5432/openokr'

image:
  repository: ghcr.io/open-okr/open-okr
  # Empty means the chart's appVersion. Pin this in production: customers pin
  # versions and nothing is force-upgraded.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# How many application pods. Migrations run in a hook rather than on pod boot,
# and the migration runner takes a Postgres advisory lock, so more than one is
# safe from the first install.
#
# One by default, and that changed on 7 September 2026. It was two, with
# persistence off, which is the one combination that loses data quietly: the
# storage mount falls back to an emptyDir, so an uploaded file lands on
# whichever pod served the request, is missing from the other, and is gone when
# either restarts. Nobody sees an error. The gap audit recorded it as B-11.
#
# Scaling out is one flag once storage is shared: a ReadWriteMany class, or
# S3-compatible object storage. See the storage section below.
replicaCount: 1

database:
  # Required. postgres:// or postgresql://, reachable from the cluster.
  # Prefer existingSecret over this: a URL set here lands in the release's
  # stored values, which anyone with `helm get values` can read.
  url: ""
  # A Secret holding the connection string. Takes precedence over url.
  existingSecret: ""
  existingSecretKey: "database-url"
  # Optional owner-role connection used only by the migration hook, so the
  # application role never owns the tables.
  adminUrl: ""

# The instance's public origin. Passkeys are bound to it, so it must be the
# address people actually use. Defaults to the first ingress host when unset.
publicUrl: ""

secrets:
  # A Secret holding BETTER_AUTH_SECRET, OPENOKR_ENCRYPTION_KEY and, from 0.7.0,
  # OPENOKR_METRICS_TOKEN. When empty, the chart generates all three on first
  # install and reads them back on upgrade, so an upgrade never rotates a key
  # underneath stored data. With your own Secret, add the metrics token key to
  # let Prometheus scrape /api/metrics; without it the pod still starts, and the
  # endpoint answers a signed-in administrator only.
  existingSecret: ""
  authSecretKey: "better-auth-secret"
  encryptionKeyKey: "encryption-key"
  metricsTokenKey: "metrics-token"

# Instance settings. Every one has a working default; these bootstrap an
# instance and are overridden by anything set later in the product.
instance:
  name: "OpenOKR"
  language: "en"
  telemetry: false
  # auto | open | company_domains | invite_only. A choice saved on Admin >
  # General wins over this.
  registration: "auto"
  # Where every member is offered the source (AGPL-3.0 section 13). Empty means
  # upstream. If you changed the code and offer it over a network, name your own.
  sourceUrl: ""
  # Named on the sign-up page once set. Web addresses.
  termsUrl: ""
  privacyUrl: ""
  # Who a customer writes to about their plan.
  supportEmail: ""
  # Reverse proxies in front of the application: one ingress controller is 1.
  # A cloud load balancer in front of the ingress is 2. 0 ignores
  # X-Forwarded-For. The caller's address, which the sign-in limits count, is
  # the entry that many places from the right.
  trustedProxyHops: 1

# Running this instance for other people, or for several companies of your own
# (PLAN.md section 5.2). Off is the ordinary self-hosted instance. On brings
# tenant records and the operator console. Plans and seat limits come only from
# `plans`, so an empty one limits nobody.
cloud:
  enabled: false
  region: ""
  # The plan catalogue, as JSON:
  # [{"key":"team","name":"Team","seats":50,"aiCredits":2000}]
  plans: ""
  # A key from `plans`, for the plan a new workspace starts on.
  defaultPlan: ""
  erasure:
    # A cron schedule for erasing closed workspaces past their retention window,
    # such as "30 3 * * *". Empty runs nothing. Nothing is erased either while
    # OPENOKR_CLOUD_CLOSURE_RETENTION_DAYS is 0, its default, so set both.
    # Needs database.adminUrl: only the owner role may delete audit rows.
    schedule: ""

# Anything else the application reads, including a credential. Prefer
# extraEnvFrom with a Secret: a value here lands in the release's stored values,
# which anyone with `helm get values` can read.
#   extraEnvFrom:
#     - secretRef:
#         name: openokr-providers
extraEnv: []
extraEnvFrom: []

mail:
  # console writes mail to the log and needs no server, which is why a fresh
  # instance works with none of this set.
  transport: "console"
  host: ""
  port: 587
  secure: false
  user: ""
  from: "openokr@localhost"
  # A Secret holding the SMTP password. Never put the password in values.
  existingSecret: ""
  existingSecretKey: "mail-password"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: openokr.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Applied to the migration hook as well, which needs less.
migrationResources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# File storage for the local-disk driver, the default. The other driver is
# S3-compatible object storage, configured under `storage.s3` below; with a
# bucket set, uploads go there and this volume holds nothing.
#
# On by default since 7 September 2026. Off was the previous default and it
# meant every upload went to an emptyDir: lost on restart, invisible to a
# sibling pod, with nothing anywhere saying so. A volume that keeps files is
# the only defensible shipped default for a driver that writes to disk.
#
# A ReadWriteOnce volume cannot be shared across nodes, so it pins the release
# to one replica and the chart refuses the combination rather than corrupting
# uploads quietly. To scale out, give it a ReadWriteMany storage class.
#
# Turning this off is a real choice for an instance that accepts no uploads or
# treats them as disposable. It is not refused, and NOTES.txt says plainly what
# it costs.
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# S3-compatible object storage (P6-G05). The way to run several replicas
# without a ReadWriteMany class: object storage is shared by definition.
#
# Naming a bucket is the whole switch. Leave it empty and the local-disk volume
# above is used, which is the default and all a self-hosted install needs.
# Works with AWS S3, MinIO, Ceph, Garage, Cloudflare R2, Backblaze B2 and
# DigitalOcean Spaces: set `endpoint` for anything that is not AWS.
storage:
  s3:
    bucket: ""
    # Required by the AWS SDK even for services that ignore it.
    region: "us-east-1"
    # A compatible service's own endpoint. Empty means AWS S3 itself.
    endpoint: ""
    # Path-style addressing, "on" or "off". Empty lets the driver decide: on
    # when an endpoint is set, off for AWS. Almost every compatible service
    # wants it on, and a virtual-host request to one resolves to a hostname
    # that does not exist.
    forcePathStyle: ""
    # Prefix every object key, so one bucket can hold several instances.
    keyPrefix: ""
    # A Secret holding the credentials. Required when a bucket is named:
    # putting a key in values would store it in the release, where anyone with
    # `helm get values` can read it. Same rule as database.existingSecret.
    existingSecret: ""
    accessKeyIdKey: "access-key-id"
    secretAccessKeyKey: "secret-access-key"

# The optional virus scan. Name a ClamAV daemon (clamd) the pods can reach and
# every uploaded file waits as "being checked" until clamd has scanned it; a
# file it flags is held back and never served. Empty is the default and means
# no scan. clamd is not part of this chart: run it as its own Deployment, or
# point at one you already have. Its signature updates are its own business.
scan:
  clamd:
    host: ""
    port: 3310

# Error reports (docs/runbooks/observability.md, "Sending errors to a
# tracker"). Every unexpected error is a JSON line in the pod's log and a
# count in openokr_errors_total either way. To also send each one to a
# tracker that speaks Sentry's protocol (Sentry, GlitchTip, Bugsink), put its
# DSN in a Secret and name it here. Empty sends nothing anywhere. The DSN is
# read from a Secret and never from values, because its key lets anyone write
# into the tracker and `helm get values` would read it back.
errors:
  existingSecret: ""
  dsnKey: "dsn"
  # Which deployment a report came from, so staging can share production's
  # tracker project without mixing with it.
  environment: "production"

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# Defaults are restrictive. The image runs as uid 1001 and writes only to its
# storage mount and /tmp.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Keeps the deployment available during a rolling update and a node drain.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Scheduled encrypted backups (P6-T06). Off by default: an operator enables it
# and points it at a volume or an existing PVC.
backup:
  enabled: false
  # Cron schedule. Default: 02:00 UTC daily.
  schedule: "0 2 * * *"
  # How many completed jobs Kubernetes keeps.
  historyLimit: 3
  # How many backup directories to keep inside the volume.
  retention: 7
  # An existing PVC for the backups. When empty, the CronJob uses an emptyDir,
  # which loses everything on pod restart and is not a backup.
  existingClaim: ""
