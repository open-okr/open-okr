# OpenOKR on one server (P1-T09).
#
#     ./openokr up
#     open http://localhost   # the wizard is waiting
#
# Or with a real domain, still no file editing:
#
#     OPENOKR_DOMAIN=okr.example.com ./openokr up
#
# Three services. Postgres is the only required one; the application is the
# product; Caddy terminates TLS and gets certificates on its own. There is no
# object storage service: the local-disk driver covers a single server, and
# anyone wanting S3-compatible storage points the environment at it without
# running anything here.
#
# Secrets are generated by `./openokr up` into ./secrets before compose starts,
# because compose reads `env_file` when it creates a container, so a service
# that generates them could never run early enough.

name: openokr

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Plain string form, not the newer object form with `required`. The object
    # form needs Compose 2.24, and a self-hosted server should not have to
    # upgrade Docker before it can run this. `./openokr up` writes these files
    # before compose starts, so a missing file means the helper was skipped.
    env_file:
      - ./secrets/db.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -U and -d are explicit. Without them pg_isready checks the root role
      # against a database that does not exist and reports healthy anyway,
      # which lets the application start against a database that is not ready.
      test: ["CMD-SHELL", "pg_isready -U openokr -d openokr"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Not published. Nothing outside this network needs the database, and a
    # published port is the most common way a self-hosted instance ends up
    # reachable from the internet.
    expose:
      - "5432"

  app:
    image: ${OPENOKR_IMAGE:-ghcr.io/open-okr/open-okr:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./secrets/app.env
    environment:
      NODE_ENV: production
      OPENOKR_INSTANCE_NAME: ${OPENOKR_INSTANCE_NAME:-OpenOKR}
    volumes:
      - storage:/app/storage
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # Overridable, because a server that already runs something on 443 should
    # not have to choose between that and this. Automatic certificates need
    # the standard ports, so moving them is for a host that already has its
    # own proxy in front.
    ports:
      - "${OPENOKR_HTTP_PORT:-80}:80"
      - "${OPENOKR_HTTPS_PORT:-443}:443"
      # HTTP/3. Harmless when unused, and one less thing to discover later.
      - "${OPENOKR_HTTPS_PORT:-443}:443/udp"
    environment:
      # A bare hostname makes Caddy fetch a certificate for it. The default is
      # an http:// address, which Caddy serves over plain HTTP without trying
      # to reach Let's Encrypt, so a laptop works with no configuration at all.
      OPENOKR_SITE: ${OPENOKR_SITE:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing them, and
      # Let's Encrypt rate-limits that, so it is a named volume rather than
      # anything temporary.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  storage:
  caddy-data:
  caddy-config:
