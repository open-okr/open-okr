; PgBouncer for the tenant-isolation spike (P1-T03, PLAN.md §12 R1).
;
; pool_mode = transaction is the whole point: a server connection is handed to
; a different client after every transaction, with no reset in between. If the
; workspace setting were applied at session level it would leak across tenants
; here. The spike suite proves SET LOCAL does not.

[databases]
; Wildcard: every per-worker test database routes to the same Postgres.
* = host=postgres port=5432

; A fixed database with a single server connection. The leak-demonstration
; test needs two clients to be guaranteed the same server connection so the
; session-level failure mode is deterministic, not racy.
openokr_spike_leak = host=postgres port=5432 dbname=openokr_spike_leak pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 5
; node-postgres may send these at startup; PgBouncer should pass them through
; rather than refuse the connection.
ignore_startup_parameters = extra_float_digits,options
