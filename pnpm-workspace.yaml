packages:
  - apps/*
  - packages/*

allowBuilds:
  # Google's own SDK (P2-T13). Its `prepare` script targets a file the
  # published tarball does not ship, so it is a no-op in this install; the
  # package itself is Apache-2.0 and officially maintained.
  '@google/genai': true
  # A transitive dependency of @google/genai, and one of the most widely used
  # packages in the ecosystem (gRPC, Firebase and others depend on it). No
  # install-time script actually runs; pnpm flags it defensively because its
  # manifest lists dev-only build scripts (bench, changelog) that never fire
  # on a consumer install.
  protobufjs: true

catalog:
  # Pinned to 5.9.x by the P1-T01 decision. The 7.x bump (dependabot PR #5)
  # broke typecheck repo-wide; adopting 7.x is its own task, not a bot merge.
  typescript: 5.9.3
  vitest: 4.1.10
  "@types/node": 26.1.2
  # 0.45.2 is the first release past GHSA-gpj5-g38j-94v9 (SQL injection via
  # improperly escaped identifiers).
  drizzle-orm: ^0.45.2
  pg: ^8.16.3
  "@types/pg": ^8.15.4
  pg-boss: ^12.27.0
  ws: ^8.21.2
  "@types/ws": ^8.18.1
  better-auth: ^1.6.26
  "@better-auth/passkey": ^1.6.26
  # The SMTP client, approved in P1-T09. MIT-0, and it carries no runtime
  # dependencies of its own. Confined to packages/adapters like every vendor
  # SDK, behind the Mailer port.
  nodemailer: ^9.0.4
  "@types/nodemailer": ^8.0.1
  # Already used by the environment schema. Shared here so the action contract
  # registry validates against the same version the boundary does.
  zod: 4.4.3
  # AIProvider drivers (P2-T13), approved by the human, confined to
  # packages/adapters like every vendor SDK. `openai`'s client also drives
  # openrouter, ollama and openai-compatible: all three speak the same
  # OpenAI-shaped chat completions API, just a different base URL and key,
  # so one client covers four of the six real drivers.
  "@anthropic-ai/sdk": ^0.116.0
  openai: ^7.4.0
  "@google/genai": ^2.16.0

minimumReleaseAgeExclude:
  - '@next/env@16.3.0'
  - '@next/swc-darwin-arm64@16.3.0'
  - '@next/swc-darwin-x64@16.3.0'
  - '@next/swc-linux-arm64-gnu@16.3.0'
  - '@next/swc-linux-arm64-musl@16.3.0'
  - '@next/swc-linux-x64-gnu@16.3.0'
  - '@next/swc-linux-x64-musl@16.3.0'
  - '@next/swc-win32-arm64-msvc@16.3.0'
  - '@next/swc-win32-x64-msvc@16.3.0'
  - next@16.3.0
  - '@better-auth/core@1.6.26'
  - '@better-auth/drizzle-adapter@1.6.26'
  - '@better-auth/kysely-adapter@1.6.26'
  - '@better-auth/memory-adapter@1.6.26'
  - '@better-auth/mongo-adapter@1.6.26'
  - '@better-auth/passkey@1.6.26'
  - '@better-auth/prisma-adapter@1.6.26'
  - '@better-auth/telemetry@1.6.26'
  - better-auth@1.6.26
