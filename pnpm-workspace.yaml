packages:
  - apps/*
  - packages/*

allowBuilds:
  # Google's own SDK (P2-T13). Its `prepare` script targets a file the
  # published tarball does not ship, so it is a no-op in this install; the
  # package itself is Apache-2.0 and officially maintained.
  '@google/genai': true
  # A transitive dependency of @google/genai, and one of the most widely used
  # packages in the ecosystem (gRPC, Firebase and others depend on it). No
  # install-time script actually runs; pnpm flags it defensively because its
  # manifest lists dev-only build scripts (bench, changelog) that never fire
  # on a consumer install.
  protobufjs: true

catalog:
  # The native compiler, adopted on 30 September 2026 after measuring it: the
  # web app checks in 6 seconds and 2.8 GB single-threaded, against 18 seconds
  # and 3.4 GB on 5.9. It was pinned to 5.9 at P1-T01 because dependabot's bump
  # broke typecheck; the two differences it found were named and fixed in the
  # same change (Node's types are named in the base tsconfig, and one load's
  # return type is written out). Next.js 16.3 type-checks through the `tsc`
  # command by default, so the build runs on it too.
  typescript: 7.0.2
  # TypeScript 7 no longer exports the compiler API (`createSourceFile`,
  # `forEachChild`). The two web tests and the one script that walk a syntax
  # tree read it from 5.9 under this name, so nothing else can pick it up by
  # accident. Same package, same licence.
  typescript5: npm:typescript@5.9.3
  vitest: 5.0.2
  "@types/node": 26.6.2
  # 0.45.2 is the first release past GHSA-gpj5-g38j-94v9 (SQL injection via
  # improperly escaped identifiers).
  drizzle-orm: ^0.45.3
  pg: ^8.23.0
  "@types/pg": ^8.23.1
  pg-boss: ^12.34.0
  ws: ^8.21.3
  "@types/ws": ^8.18.1
  better-auth: ^1.7.6
  "@better-auth/passkey": ^1.7.6
  "@better-auth/sso": ^1.7.6
  samlify: ^2.13.1
  # The SMTP client, approved in P1-T09. MIT-0, and it carries no runtime
  # dependencies of its own. Confined to packages/adapters like every vendor
  # SDK, behind the Mailer port.
  nodemailer: ^10.0.10
  "@types/nodemailer": ^8.0.2
  # Image re-encoding and thumbnails (completeness review M-24), approved by
  # the human on 28 September 2026. Apache-2.0, and its prebuilt libvips
  # binaries are LGPL-3.0-or-later, which the licence gate already allows.
  # The same range `next` asks for as its own optional dependency, so the
  # lockfile holds one copy. Confined to packages/adapters behind the
  # ImageProcessor port; `pnpm check:boundaries` refuses it anywhere else.
  sharp: ^0.35.4
  # Already used by the environment schema. Shared here so the action contract
  # registry validates against the same version the boundary does.
  zod: 4.6.5
  # AIProvider drivers (P2-T13), approved by the human, confined to
  # packages/adapters like every vendor SDK. `openai`'s client also drives
  # openrouter, ollama and openai-compatible: all three speak the same
  # OpenAI-shaped chat completions API, just a different base URL and key,
  # so one client covers four of the six real drivers.
  "@anthropic-ai/sdk": ^0.128.0
  openai: ^7.23.0
  "@google/genai": ^2.24.0
  # The design system (P2-T10), approved by the human alongside P2-T11's
  # TipTap. CLAUDE.md's locked stack already names Tailwind, Base UI and
  # SmoothUI on Motion; these are the concrete packages that stack resolves
  # to. `clsx`/`tailwind-merge`/`class-variance-authority` are the standard
  # shadcn/ui variant-and-class-merge trio, not a separate dependency
  # decision — shadcn/ui itself does not ship as an installable package, it
  # is components pulled into packages/ui at build time, and every one of
  # them is written against this trio.
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  postcss: ^8.5.28
  "@base-ui-components/react": 1.0.0-rc.0
  motion: ^13.4.4
  lucide-react: ^1.48.0
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  class-variance-authority: ^0.7.1
  # The persisted client cache (P2-T10 item 9), part of the locked stack's
  # "TanStack Query, Table and Virtual" line — its own persistence add-ons,
  # not a new stack decision.
  "@tanstack/react-query": ^5.104.0
  "@tanstack/react-query-persist-client": ^5.104.0
  "@tanstack/query-sync-storage-persister": ^5.104.0
  # Test tooling for P2-T10's own required "keyboard and focus component
  # tests" and accessibility checks (UIUX-PLAN.md §9) — inferred from the
  # human's UI-dependency approval rather than asked separately, because
  # without a DOM testing seam those acceptance tests cannot exist at all.
  # Dev-only, never shipped.
  jsdom: ^30.1.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.7
  # The rich text editor (P2-T11), approved by the human alongside P2-T10's
  # design-system deps. Every @tiptap/* package in v3 peer-pins its
  # siblings to the exact same version string, not a range, so all four
  # pin identically rather than each getting its own `^` range.
  "@tiptap/core": 3.31.3
  "@tiptap/pm": 3.31.3
  "@tiptap/react": 3.31.3
  "@tiptap/starter-kit": 3.31.3
  "@tiptap/extension-table": 3.31.3
  "@tiptap/extension-mention": 3.31.3
  "@tiptap/suggestion": 3.31.3

minimumReleaseAgeExclude:
  - '@next/env@16.3.0'
  - '@next/swc-darwin-arm64@16.3.0'
  - '@next/swc-darwin-x64@16.3.0'
  - '@next/swc-linux-arm64-gnu@16.3.0'
  - '@next/swc-linux-arm64-musl@16.3.0'
  - '@next/swc-linux-x64-gnu@16.3.0'
  - '@next/swc-linux-x64-musl@16.3.0'
  - '@next/swc-win32-arm64-msvc@16.3.0'
  - '@next/swc-win32-x64-msvc@16.3.0'
  - next@16.3.0
  - '@better-auth/core@1.6.26'
  - '@better-auth/drizzle-adapter@1.6.26'
  - '@better-auth/kysely-adapter@1.6.26'
  - '@better-auth/memory-adapter@1.6.26'
  - '@better-auth/mongo-adapter@1.6.26'
  - '@better-auth/passkey@1.6.26'
  - '@better-auth/prisma-adapter@1.6.26'
  - '@better-auth/telemetry@1.6.26'
  - better-auth@1.6.26
  - lucide-react@1.31.0
