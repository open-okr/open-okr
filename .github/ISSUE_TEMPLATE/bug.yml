name: Bug
description: Something does not work the way it says it does
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before you start: if this is a security problem, do not open an issue.
        Follow `SECURITY.md` instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The tag you are running, or the commit if you built it yourself.
      placeholder: v1.2.3
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How it is deployed
      options:
        - Docker Compose, one server
        - Kubernetes, Helm chart
        - The managed cloud
        - A development checkout
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. One of each.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Error details
      description: >
        If you saw the error page, press "Copy details" on it and paste here.
        It gives the version, the reference, the time and the page, and names
        nobody. The reference also finds the matching line in the server log,
        `"kind":"error.report"`.
      render: text
      placeholder: |
        OpenOKR 0.7.0
        Reference: 3141592653
        Time: 2026-11-09T10:00:00.000Z
        Page: /goals/[id]
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >
        The error, the log lines around it, or the screenshot. Redact anything
        personal. Never paste a token, a provider key or a connection string.
  - type: checkboxes
    id: rule
    attributes:
      label: If the product refused something
      options:
        - label: The message cited a rule key, and I have included it
          required: false
