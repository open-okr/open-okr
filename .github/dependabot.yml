version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Pinned to 5.9.x by the P1-T01 decision. Moving to a new major is a
      # human task with its own verification, not a bot bump: the 7.0.2 bump
      # broke typecheck on main.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # One pull request per group keeps review cost down. Security updates
      # still arrive on their own, immediately.
      dev-tooling:
        patterns: ["@biomejs/*", "turbo", "vitest", "knip", "typescript", "@types/*"]
      next:
        patterns: ["next", "react", "react-dom", "@next/*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
