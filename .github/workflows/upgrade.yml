name: Upgrade

# **What this catches that nothing else does.**
#
# Every other gate looks at one commit. This one boots the release an
# instance is actually running, upgrades it to the commit under test, and
# asks whether the workspace survived. That is the only question a
# self-hosted operator has on upgrade day, and no amount of unit testing
# answers it: a migration that drops a column the previous release still
# reads passes typecheck, passes its own test, and breaks every pod serving
# traffic during the rollout.
#
# PLAN.md §5.1 is the contract: any release upgrades directly to any later
# release in the same major, with no stops, and rolling back means restoring
# a backup rather than running the previous tag.
#
# Runs on a schedule and on demand rather than on every pull request. It
# builds two images and boots a database twice, which is minutes rather than
# seconds, and the thing it protects changes at the pace of migrations
# rather than at the pace of commits.

on:
  schedule:
    # Every night at 02:15 UTC. Late enough that the day's merges are in,
    # early enough that somebody reads the result before the next working day.
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      baseline:
        description: "The commit or tag to upgrade from. Defaults to the pinned baseline below."
        required: false
        type: string

permissions:
  contents: read

env:
  # **The oldest supported release** (PLAN.md §5.1), v0.1.2 since P9-T22a.
  #
  # Until then this was a pinned commit standing in for a release that did
  # not exist. 0.2.0 is the first release that changes how the practice
  # behaves for an instance already running, so the upgrade it has to prove
  # is the one a 0.1.2 operator makes. Never `main`, which would make this
  # job compare a commit against itself and pass for free.
  UPGRADE_BASELINE: v0.1.2

jobs:
  compose:
    name: Upgrade on Compose
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the baseline
        id: baseline
        env:
          REQUESTED: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          ref="${REQUESTED:-$UPGRADE_BASELINE}"
          # Refuse a baseline that is the commit under test. An upgrade from
          # a commit to itself proves nothing and would pass every time,
          # which is worse than not running: a green job nobody can trust is
          # a green job everybody stops reading.
          if [ "$(git rev-parse "$ref")" = "$(git rev-parse HEAD)" ]; then
            echo "The baseline and the commit under test are the same." >&2
            echo "This job would prove nothing. Move UPGRADE_BASELINE." >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Build the baseline image
        run: |
          set -euo pipefail
          git worktree add ../baseline "${{ steps.baseline.outputs.ref }}"
          docker build -t openokr:baseline -f ../baseline/deploy/docker/Dockerfile ../baseline

      - name: Build the image under test
        run: docker build -t openokr:under-test -f deploy/docker/Dockerfile .

      # The baseline boots with its own lifecycle helper, because that is what
      # an existing install has: the secrets it wrote are the old shape, and
      # carrying them into the new helper's `upgrade` is the upgrade. Booting
      # the old image with the new helper tested a combination nobody runs, and
      # stopped working the day the helper started writing two database roles
      # the old image's migrator cannot create (completeness review H-01).
      - name: Boot the baseline and seed a workspace
        working-directory: ../baseline/deploy/docker
        env:
          OPENOKR_IMAGE: openokr:baseline
          OPENOKR_SKIP_PULL: "1"
        run: |
          set -euo pipefail
          ./openokr up

          # **The registration happens here rather than by running the smoke
          # test.** This step used to call `smoke-test.sh` to seed, and that
          # script tears its own instance down on exit, volumes and secrets
          # included: its `cleanup` says so. The seed was destroyed the
          # moment it was made, and every step after this one met
          # `service "db" is not running`. The job failed that way every
          # night from at least 15 September and never once tested an
          # upgrade.
          #
          # The request below is the one the smoke test makes internally, so
          # the rows asserted on afterwards are still written by the product
          # rather than inserted behind it.
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "http://localhost/api/auth/sign-up/email" \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"correct-horse-battery-staple","name":"Ada Lovelace"}')"
          [ "$code" = "200" ] || {
            echo "creating the first account on the baseline returned $code" >&2
            exit 1
          }
          echo "baseline seeded: one account and one provisioned workspace"

      - name: Record what the baseline holds
        id: before
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          # Counted through the database rather than the interface: the
          # question is whether the data survived, and a screen that renders
          # is a weaker claim than a row that is still there.
          for table in workspaces workspace_members goals audit_events; do
            n="$(docker compose -p openokr exec -T db psql -U openokr -d openokr -tAc "select count(*) from ${table}")"
            echo "${table}=${n}" >> "$GITHUB_OUTPUT"
            echo "baseline ${table}: ${n}"
          done

      - name: Upgrade to the commit under test
        working-directory: deploy/docker
        env:
          OPENOKR_IMAGE: openokr:under-test
          OPENOKR_SKIP_PULL: "1"
        run: |
          set -euo pipefail
          # The helper takes its own backup first and refuses without one,
          # which is the rollback path PLAN.md §5.1 requires. Not skipped
          # here: this job is the one place that path runs end to end.
          #
          # The operator's secrets move with them to the new checkout.
          cp -Rp ../../../baseline/deploy/docker/secrets ./secrets
          ./openokr upgrade

      - name: The upgraded instance runs as a role the tenant floor binds
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          grep -q '^DATABASE_URL=postgres://openokr_app:' secrets/app.env || {
            echo "the upgrade left the server on the superuser" >&2
            exit 1
          }
          attrs="$(docker compose -p openokr exec -T db psql -U openokr -d openokr -tAc \
            "select rolsuper::text || ',' || rolbypassrls::text from pg_roles where rolname = 'openokr_app'")"
          [ "$attrs" = "false,false" ] || {
            echo "openokr_app is '${attrs}', expected false,false" >&2
            exit 1
          }
          health=""
          for _ in $(seq 1 30); do
            health="$(curl -s http://localhost/api/health || true)"
            case "$health" in
              *'"scheduler":"running"'*'"tenantFloor":"enforced"'*) break ;;
            esac
            sleep 2
          done
          echo "health: ${health}"
          case "$health" in
            *'"scheduler":"running"'*'"tenantFloor":"enforced"'*) ;;
            *) echo "expected a running scheduler and an enforced floor" >&2; exit 1 ;;
          esac

      - name: The workspace is intact and a member can sign in
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          for pair in \
            "workspaces=${{ steps.before.outputs.workspaces }}" \
            "workspace_members=${{ steps.before.outputs.workspace_members }}" \
            "goals=${{ steps.before.outputs.goals }}" ; do
            table="${pair%%=*}"
            was="${pair#*=}"
            now="$(docker compose -p openokr exec -T db psql -U openokr -d openokr -tAc "select count(*) from ${table}")"
            [ "$now" = "$was" ] || {
              echo "${table}: ${was} before the upgrade, ${now} after" >&2
              exit 1
            }
            echo "${table}: ${now}, unchanged"
          done

          # **Every workspace is on the recommended profile** (P9-T22a). 0.1.2
          # had no practice settings, so a workspace upgrading to 0.2.0 starts
          # from METHOD.md's defaults, and the operator chooses Governed to
          # keep the stricter behaviour. A workspace with no settings row reads
          # the default, which is what `coalesce` says.
          off="$(docker compose -p openokr exec -T db psql -U openokr -d openokr -tAc \
            "select count(*) from workspaces w left join rhythm_settings r on r.workspace_id = w.id where coalesce(r.profile, 'recommended') <> 'recommended'")"
          [ "$off" = "0" ] || {
            echo "${off} workspace(s) upgraded onto a profile other than recommended" >&2
            exit 1
          }
          echo "every workspace on the recommended profile"

          # **The audit trail may only grow.** It is append-only by design and
          # the upgrade itself writes to it, so equality would be the wrong
          # assertion here and shrinkage is the failure worth catching.
          was="${{ steps.before.outputs.audit_events }}"
          now="$(docker compose -p openokr exec -T db psql -U openokr -d openokr -tAc "select count(*) from audit_events")"
          [ "$now" -ge "$was" ] || {
            echo "audit_events fell from ${was} to ${now}" >&2
            exit 1
          }
          echo "audit_events: ${was} before, ${now} after"

      - name: A backup exists, because that is the only rollback there is
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          count="$(ls -1d ./backups/*/ 2>/dev/null | wc -l | tr -d ' ')"
          [ "$count" -gt 0 ] || {
            echo "the upgrade left no backup" >&2
            exit 1
          }
          echo "${count} backup(s) on disk"

      - name: What went wrong
        if: failure()
        working-directory: deploy/docker
        run: docker compose -p openokr logs --tail=200 || true

      - name: Stop
        if: always()
        working-directory: deploy/docker
        run: ./openokr down || true

  helm:
    name: Upgrade on the Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the baseline
        id: baseline
        env:
          REQUESTED: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          ref="${REQUESTED:-$UPGRADE_BASELINE}"
          if [ "$(git rev-parse "$ref")" = "$(git rev-parse HEAD)" ]; then
            echo "The baseline and the commit under test are the same." >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Build both images
        run: |
          set -euo pipefail
          git worktree add ../baseline "${{ steps.baseline.outputs.ref }}"
          docker build -t openokr:baseline -f ../baseline/deploy/docker/Dockerfile ../baseline
          docker build -t openokr:under-test -f deploy/docker/Dockerfile .

      - name: Create a cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: openokr-upgrade
          wait: 120s

      - name: Load both images into the cluster
        # No registry involved: the cluster runs the two images this job
        # built, which is what makes the comparison about the code rather
        # than about what happened to be published.
        run: |
          set -euo pipefail
          kind load docker-image openokr:baseline --name openokr-upgrade
          kind load docker-image openokr:under-test --name openokr-upgrade

      - name: Install the baseline and use it
        # The chart's own script installs, waits for readiness and registers
        # a user, which is the seed this job then asserts survived.
        run: OPENOKR_IMAGE_TAG=baseline sh ../baseline/deploy/helm/cluster-test.sh

      - name: Record what the baseline holds
        id: before
        run: |
          set -euo pipefail
          # **The namespace, the label and the release name were all wrong,
          # and each one alone was fatal.** `cluster-test.sh` installs into
          # `openokr-test` as the release `okr`, and labels its stand-in
          # Postgres `app: postgres`. This looked in `default` for
          # `app.kubernetes.io/component=postgresql`, found nothing, and ran
          # `kubectl exec` with an empty pod name, so the job died on
          # "pod, type/name or --filename must be specified" before it
          # upgraded anything. Every night from at least 15 September.
          pod="$(kubectl get pod -n openokr-test -l app=postgres -o name | head -1)"
          [ -n "$pod" ] || {
            echo "no postgres pod in openokr-test: the baseline never installed" >&2
            exit 1
          }
          for table in workspaces workspace_members audit_events; do
            n="$(kubectl exec -n openokr-test "$pod" -- psql -U openokr -d openokr -tAc "select count(*) from ${table}")"
            echo "${table}=$(echo "$n" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          done

      - name: Upgrade the release
        # **The rolling half, which is the point of doing this on Kubernetes
        # at all.** Pods of the baseline and the commit under test serve
        # together against the new schema for the length of the rollout, so
        # a migration that drops a column the baseline still reads breaks
        # every request those pods serve. The Compose job cannot see that:
        # it stops one container and starts another.
        run: |
          set -euo pipefail
          # The release is `okr` in `openokr-test`, and `--reuse-values` is
          # not optional: without it the database URL, the replica count and
          # the pull policy `cluster-test.sh` installed with are all dropped,
          # and the upgrade rolls out a release that cannot reach a database.
          helm upgrade okr deploy/helm \
            --namespace openokr-test \
            --reuse-values \
            --set image.tag=under-test \
            --wait --timeout 10m

      - name: The workspace is intact
        run: |
          set -euo pipefail
          pod="$(kubectl get pod -n openokr-test -l app=postgres -o name | head -1)"
          for pair in \
            "workspaces=${{ steps.before.outputs.workspaces }}" \
            "workspace_members=${{ steps.before.outputs.workspace_members }}" ; do
            table="${pair%%=*}"
            was="${pair#*=}"
            now="$(kubectl exec -n openokr-test "$pod" -- psql -U openokr -d openokr -tAc "select count(*) from ${table}" | tr -d ' ')"
            [ "$now" = "$was" ] || {
              echo "${table}: ${was} before the upgrade, ${now} after" >&2
              exit 1
            }
          done
          # On the recommended profile, as on Compose (P9-T22a).
          off="$(kubectl exec -n openokr-test "$pod" -- psql -U openokr -d openokr -tAc \
            "select count(*) from workspaces w left join rhythm_settings r on r.workspace_id = w.id where coalesce(r.profile, 'recommended') <> 'recommended'" | tr -d ' ')"
          [ "$off" = "0" ] || {
            echo "${off} workspace(s) upgraded onto a profile other than recommended" >&2
            exit 1
          }
          # Append-only, so it may grow and must not shrink.
          was="${{ steps.before.outputs.audit_events }}"
          now="$(kubectl exec -n openokr-test "$pod" -- psql -U openokr -d openokr -tAc "select count(*) from audit_events" | tr -d ' ')"
          [ "$now" -ge "$was" ] || {
            echo "audit_events fell from ${was} to ${now}" >&2
            exit 1
          }

      - name: What went wrong
        if: failure()
        run: |
          kubectl get pods -n openokr-test -o wide || true
          kubectl logs -n openokr-test -l app.kubernetes.io/name=openokr --tail=200 || true
