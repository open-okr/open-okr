name: Release

# Only on a version tag. Nothing publishes on a push to main, so an image
# reaching a registry is always a deliberate act (PLAN.md §170: customers pin
# versions and nothing is force-upgraded).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  # The tag is not trusted to mean the code is good. Everything that gates a
  # pull request gates a release too, and the image is not built until it
  # passes.
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    # Its own stack name, so a leftover container from another job on the same
    # host cannot hold this one's port. The defaults are fine here: nothing else
    # in this workflow starts a database.
    env:
      COMPOSE_PROJECT_NAME: openokr-test-release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Dead code gate
        run: pnpm dead-code
      - name: Migration and soft-delete lint
        run: pnpm db:lint
      - name: Architecture boundary gate
        run: pnpm check:boundaries
      - name: Dependency licence gate
        run: pnpm check:licences

      - name: Start the test database stack
        run: pnpm db:up
      - name: Tests
        run: pnpm test

      # A tag reaches customers, so it gets more scrutiny than a pull request,
      # not less. These three were only on the pull-request workflow, which
      # meant a release could publish a chart or a compose target that nobody
      # had installed since the last merge.
      - name: Commit sign-off gate
        run: pnpm check:signoff
      - name: Chart checks
        run: sh deploy/helm/check.sh
      - name: Build the image and boot the compose target
        run: |
          docker build -f deploy/docker/Dockerfile -t openokr:release-check .
          OPENOKR_IMAGE=openokr:release-check OPENOKR_SKIP_PULL=1 \
            sh deploy/docker/smoke-test.sh

  publish:
    name: Build, publish and sign
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Push to GitHub Container Registry.
      packages: write
      # The OIDC token cosign exchanges for a short-lived certificate. This is
      # what makes keyless signing possible: there is no private key to store,
      # rotate or leak, and the signature records which workflow at which
      # commit produced the image.
      id-token: write
      # Lets the attestation be recorded against the repository.
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # v1.2.3 publishes 1.2.3, 1.2 and 1. No `latest` on a prerelease.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          # Both architectures: a customer's cluster is as likely to be arm64
          # as amd64, and a single-architecture image fails at pull time with a
          # message nobody enjoys reading.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Records the commit and workflow that produced the image, so a
          # published artefact can be traced back without trusting the tag.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        # Keyless: cosign exchanges the workflow's OIDC token for a short-lived
        # certificate from Sigstore and records the signature in the public
        # transparency log. Verifying proves which workflow, at which commit,
        # built the image, rather than proving somebody held a key.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"

      - name: Attest the build
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # A published signature nobody checks is decoration. This verifies the
  # signature from outside the publishing job, the same way a customer would.
  verify-signature:
    name: Verify the published signature
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only, deliberately. Verification is what a customer does, and a
      # customer has no ability to sign. A job that could mint a signing
      # certificate is not checking the same thing they would.
      packages: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${REGISTRY}/${IMAGE}@${DIGEST}"
          echo "Signature verified for ${REGISTRY}/${IMAGE}@${DIGEST}"

  # The artefact set, in one place (P7-T09b).
  #
  # **A bill of materials attested to an image is not a bill of materials a
  # person can read.** `sbom: true` on the build step puts one in the
  # registry, where reading it needs cosign, a digest and a reason to look.
  # An auditor asking "what is in the release we deployed in March" wants a
  # file on the release page. So the same image is scanned again into a file
  # and attached beside the notes.
  #
  # The notes come from the changesets the changes carried, which is the
  # whole point of `.changeset`: the sentence a release note needs was
  # written by the person who made the change, while they still knew whether
  # it broke anything.
  release:
    name: Publish the release and its bill of materials
    needs: [publish, verify-signature]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, because the notes are assembled from the
          # changesets between this tag and the last.
          fetch-depth: 0

      - name: Generate the bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
          format: spdx-json
          artifact-name: openokr-${{ github.ref_name }}.spdx.json
          output-file: openokr-${{ github.ref_name }}.spdx.json

      - name: Assemble the notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          # CHANGELOG.md is written by `changeset version` on the branch that
          # bumped the version, so by tag time the section for this release
          # already exists. Taking it from the file rather than regenerating
          # it means the notes and the changelog cannot disagree.
          if [ -f CHANGELOG.md ]; then
            awk -v tag="${TAG#v}" '
              $0 ~ "^## " tag "$" { grab = 1; next }
              grab && /^## / { exit }
              grab { print }
            ' CHANGELOG.md > notes.md
          else
            : > notes.md
          fi
          if [ ! -s notes.md ]; then
            # Never silently empty. A release with no notes is a release
            # nobody can decide whether to take, and saying so is better than
            # publishing a blank page.
            printf 'No changelog section was found for %s. See the commit log.\n' "${TAG}" > notes.md
          fi
          {
            printf '\n---\n\n'
            printf 'Image: `%s/%s@%s`\n\n' "${REGISTRY}" "${IMAGE}" "${DIGEST}"
            printf 'Verify the signature before you run it:\n\n'
            printf '```\ncosign verify \\n'
            printf '  --certificate-identity-regexp "^https://github.com/%s/.github/workflows/release.yml@refs/tags/" \\n' "${GITHUB_REPOSITORY}"
            printf '  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \\n'
            printf '  %s/%s@%s\n```\n' "${REGISTRY}" "${IMAGE}" "${DIGEST}"
          } >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file notes.md \
            --prerelease="${{ contains(github.ref_name, '-') }}" \
            "openokr-${TAG}.spdx.json#Software bill of materials (SPDX)"

  chart:
    name: Package the chart
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The chart's appVersion follows the release, so `helm install` with
          # no image.tag installs the version that was just published rather
          # than whatever the chart was committed with.
          helm package deploy/helm \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist

      - name: Publish to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          VERSION="${GITHUB_REF_NAME#v}"
          helm push "dist/openokr-${VERSION}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
