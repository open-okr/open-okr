name: Release

# Only on a version tag. Nothing publishes on a push to main, so an image
# reaching a registry is always a deliberate act (PLAN.md §170: customers pin
# versions and nothing is force-upgraded).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  # The tag is not trusted to mean the code is good. Everything that gates a
  # pull request gates a release too, and the image is not built until it
  # passes.
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    # About thirty minutes when healthy. Twice that is a hang, not a slow day.
    timeout-minutes: 60
    # Its own stack name, so a leftover container from another job on the same
    # host cannot hold this one's port. The default ports are fine: the only
    # other database here is the compose target's, which the smoke step starts
    # under a name of its own.
    env:
      COMPOSE_PROJECT_NAME: openokr-test-release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # **First, before anything slow.** v0.3.1 was first pushed on a stale
      # local checkout and landed on a commit that still said 0.2.0. Nothing
      # noticed: verification would have passed, because that commit was good
      # code, and the image would have shipped 0.2.0 under the 0.3.1 tag. The
      # version a release PR wrote is the one thing a wrong commit cannot fake.
      #
      # A prerelease is compared without its suffix, so v1.2.3-rc.1 belongs on
      # the commit that says 1.2.3.
      - name: The tag matches the version the commit carries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          want="${want%%-*}"
          have="$(node -p 'require("./apps/web/package.json").version')"
          if [ "$want" != "$have" ]; then
            echo "::error::${TAG} is on a commit whose version is ${have}, not ${want}." >&2
            echo "Tag the merge of the release pull request: git fetch origin, then git tag ${TAG} origin/main." >&2
            exit 1
          fi
          echo "${TAG} matches ${have}"

      - uses: ./.github/actions/setup

      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Dead code gate
        run: pnpm dead-code
      - name: Migration and soft-delete lint
        run: pnpm db:lint
      - name: Architecture boundary gate
        run: pnpm check:boundaries
      - name: Dependency licence gate
        run: pnpm check:licences

      - name: Start the test database stack
        run: pnpm db:up
      # **One package at a time.** Every package's tests at once, on one
      # runner beside the database stack, slowed them about fifty times: the
      # Draft Coach's timing test measured 1.0 to 1.4 ms per evaluation here
      # against 0.025 ms on a workstation, and v0.3.0 failed verification
      # three times on that and an entity picker timeout. CI splits the suite
      # across two runners instead; this job has one.
      - name: Tests
        run: pnpm test --concurrency=1

      # A tag reaches customers, so it gets more scrutiny than a pull request,
      # not less. These three were only on the pull-request workflow, which
      # meant a release could publish a chart or a compose target that nobody
      # had installed since the last merge.
      - name: Commit sign-off gate
        run: pnpm check:signoff
      - name: Chart checks
        run: sh deploy/helm/check.sh
      - name: Build the image and boot the compose target
        # A stack of its own rather than the job's test stack. Under one shared
        # name the two compose files' containers become each other's orphans
        # and share one default network, which `down` then cannot remove.
        env:
          COMPOSE_PROJECT_NAME: openokr-release-smoke
        run: |
          docker build -f deploy/docker/Dockerfile -t openokr:release-check .
          OPENOKR_IMAGE=openokr:release-check OPENOKR_SKIP_PULL=1 \
            sh deploy/docker/smoke-test.sh

  # Both architectures: a customer's cluster is as likely to be arm64 as
  # amd64, and a single-architecture image fails at pull time with a message
  # nobody enjoys reading. Each is built natively and pushed by digest only,
  # so nothing a customer pulls points at either until it is signed.
  build:
    name: Build
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      publish: true

  # **The version tag first, the floating tags last.** v0.3.1's second
  # attempt pushed `latest` and then failed before signing, so every Compose
  # install, which defaults to `latest`, would have pulled an unsigned image
  # with no release notes beside it. Here only the exact version tag exists
  # until the signature has been verified, and that tag is not the one
  # anybody lands on by default.
  publish:
    name: Join, publish and sign
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Push to GitHub Container Registry.
      packages: write
      # The OIDC token cosign exchanges for a short-lived certificate. This is
      # what makes keyless signing possible: there is no private key to store,
      # rotate or leak, and the signature records which workflow at which
      # commit produced the image.
      id-token: write
      # Lets the attestation be recorded against the repository.
      attestations: write
    outputs:
      digest: ${{ steps.join.outputs.digest }}
    steps:
      - name: Collect both digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Both architectures are here
        run: |
          set -euo pipefail
          count="$(find "${RUNNER_TEMP}/digests" -type f | wc -l | tr -d ' ')"
          if [ "$count" != "2" ]; then
            echo "::error::Expected one digest per architecture, two in all, and found ${count}." >&2
            ls -la "${RUNNER_TEMP}/digests" >&2 || true
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the version tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}

      - name: Join both architectures under the version tag
        id: join
        working-directory: ${{ runner.temp }}/digests
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do
            sources+=("${REGISTRY}/${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create --tag "$REF" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::Could not read the digest of ${REF}" >&2; exit 1 ;;
          esac
          docker buildx imagetools inspect "$REF"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        # Keyless: cosign exchanges the workflow's OIDC token for a short-lived
        # certificate from Sigstore and records the signature in the public
        # transparency log. Verifying proves which workflow, at which commit,
        # built the image, rather than proving somebody held a key.
        env:
          DIGEST: ${{ steps.join.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"

      - name: Attest the build
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.join.outputs.digest }}
          push-to-registry: true

  # A published signature nobody checks is decoration. This verifies the
  # signature from outside the publishing job, the same way a customer would.
  verify-signature:
    name: Verify the published signature
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Read-only, deliberately. Verification is what a customer does, and a
      # customer has no ability to sign. A job that could mint a signing
      # certificate is not checking the same thing they would.
      packages: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${REGISTRY}/${IMAGE}@${DIGEST}"
          echo "Signature verified for ${REGISTRY}/${IMAGE}@${DIGEST}"

  # `latest`, `1.2` and `1` move onto the signed digest only now, after its
  # signature has been verified from outside. A prerelease moves none of them.
  promote:
    name: Move the floating tags
    needs: [publish, verify-signature]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Sign in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the floating tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # The semver patterns skip a prerelease on their own, and `latest`
          # is switched off for one by name.
          tags: |
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Point them at the signed digest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tags+=("$tag")
          done <<< "$TAGS"
          if [ "${#tags[@]}" = "0" ]; then
            echo "A prerelease: no floating tag moves."
            exit 0
          fi
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          # One source and no annotations: buildx pushes the source's bytes
          # unchanged (util/imagetools/create.go, "on single source, return
          # original bytes"), so the digest and its signature carry over.
          docker buildx imagetools create "${args[@]}" "${REGISTRY}/${IMAGE}@${DIGEST}"
          # Checked rather than assumed. A tag on any other digest has no
          # signature, which is the exact state this ordering exists to avoid.
          for tag in "${tags[@]}"; do
            got="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::${tag} resolves to ${got}, not the signed ${DIGEST}" >&2
              exit 1
            fi
            echo "${tag} -> ${got}"
          done

  # The artefact set, in one place (P7-T09b).
  #
  # **A bill of materials attested to an image is not a bill of materials a
  # person can read.** `sbom: true` on the build in image.yml puts one in the
  # registry, where reading it needs cosign, a digest and a reason to look.
  # An auditor asking "what is in the release we deployed in March" wants a
  # file on the release page. So the same image is scanned again into a file
  # and attached beside the notes.
  #
  # The notes come from the changesets the changes carried, which is the
  # whole point of `.changeset`: the sentence a release note needs was
  # written by the person who made the change, while they still knew whether
  # it broke anything.
  release:
    name: Publish the release and its bill of materials
    # After the floating tags, so the release GitHub marks Latest is never
    # ahead of the image `latest` pulls.
    needs: [publish, verify-signature, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, because the notes are assembled from the
          # changesets between this tag and the last.
          fetch-depth: 0

      - name: Generate the bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
          format: spdx-json
          artifact-name: openokr-${{ github.ref_name }}.spdx.json
          output-file: openokr-${{ github.ref_name }}.spdx.json

      - name: Assemble the notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          # The changelog is written by `changeset version` on the branch that
          # bumped the version, so by tag time the section for this release
          # already exists. Taking it from the file rather than regenerating
          # it means the notes and the changelog cannot disagree.
          #
          # apps/web's, because Changesets never versions a monorepo's root
          # package: every changeset names @openokr/web, the application, and
          # the fixed group moves every package to the same number with it.
          #
          # A prerelease is looked up without its suffix, as the verify job
          # compares it. `changeset version` writes "## 1.2.3", and v1.2.3-rc.1
          # is tagged on that same commit, so the candidate's notes are the
          # version's. Looking for "## 1.2.3-rc.1" found nothing, and every
          # candidate page read "No changelog section was found".
          CHANGELOG=apps/web/CHANGELOG.md
          version="${TAG#v}"
          version="${version%%-*}"
          if [ -f "$CHANGELOG" ]; then
            awk -v version="${version}" '
              $0 ~ "^## " version "$" { grab = 1; next }
              grab && /^## / { exit }
              grab { print }
            ' "$CHANGELOG" > notes.md
          else
            : > notes.md
          fi
          if [ ! -s notes.md ]; then
            # Never silently empty. A release with no notes is a release
            # nobody can decide whether to take, and saying so is better than
            # publishing a blank page.
            printf 'No changelog section was found for %s. See the commit log.\n' "${TAG}" > notes.md
          fi
          {
            printf '\n---\n\n'
            printf 'Image: `%s/%s@%s`\n\n' "${REGISTRY}" "${IMAGE}" "${DIGEST}"
            printf 'Verify the signature before you run it:\n\n'
            printf '```\ncosign verify \\n'
            printf '  --certificate-identity-regexp "^https://github.com/%s/.github/workflows/release.yml@refs/tags/" \\n' "${GITHUB_REPOSITORY}"
            printf '  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \\n'
            printf '  %s/%s@%s\n```\n' "${REGISTRY}" "${IMAGE}" "${DIGEST}"
          } >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file notes.md \
            --prerelease="${{ contains(github.ref_name, '-') }}" \
            "openokr-${TAG}.spdx.json#Software bill of materials (SPDX)"

  chart:
    name: Package the chart
    # The chart installs the version tag by default, so it waits for that
    # image's signature to verify rather than publishing beside an unsigned one.
    needs: [publish, verify-signature]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The chart's appVersion follows the release, so `helm install` with
          # no image.tag installs the version that was just published rather
          # than whatever the chart was committed with.
          helm package deploy/helm \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist

      - name: Publish to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          VERSION="${GITHUB_REF_NAME#v}"
          helm push "dist/openokr-${VERSION}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
