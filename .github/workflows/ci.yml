name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the previous run pointless. Cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Turbo prints which packages it skipped, which is how the "unaffected packages
  # are skipped" acceptance criterion is checked on a documentation-only change.
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # Decides what the rest of the run needs to do. A documentation-only change
  # skips the code jobs entirely.
  scope:
    name: Work out what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: filter
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "No usable base commit. Running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"; echo "$CHANGED"
          # Anything that is not documentation counts as code. Tested with a
          # non-empty check rather than `grep -qv`, whose exit code differs
          # between GNU and BSD grep.
          CODE=$(echo "$CHANGED" | grep -vE '^(docs/|\.github/ISSUE_TEMPLATE/|.*\.md$|LICENSE$)' || true)
          if [ -n "$CODE" ]; then
            echo "Code changed:"; echo "$CODE"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation-only change. Code jobs will be skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Types, lint and dead code
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Type check (affected only)
        run: pnpm turbo run typecheck --affected

      - name: Lint
        run: pnpm lint

      - name: Dead code gate
        run: pnpm dead-code

      - name: Migration and soft-delete lint
        run: pnpm db:lint

      - name: Architecture boundary gate
        # Vendor SDKs stay inside packages/adapters, application code
        # consumes ports, and write paths cause side effects only through
        # the outbox.
        run: pnpm check:boundaries

  test:
    name: Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Sharding scaffold. Raise this as the suite grows; nothing else changes.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Start the test database stack
        # Postgres plus PgBouncer in transaction mode; the P1-T03 isolation
        # and pooling-spike suites run against it on every shard.
        run: pnpm db:up

      - name: Run tests
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        # --retry keeps a briefly unreliable test from blocking the queue. The
        # flakiness reporter records every retry so it cannot pass silently.
        run: pnpm test:ci --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload flakiness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-report-${{ matrix.shard }}
          path: .flaky/report-*.json
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: End to end
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Start the test database stack
        run: pnpm db:up

      # Chromium only, and the headless shell rather than the full browser.
      # The suite exists for the claims a browser has to settle, not for
      # cross-browser coverage, which would cost minutes on every push.
      - name: Install Chromium
        run: pnpm test:e2e:install

      - name: Build the application
        # The suite runs `next start`, so what it tests is what ships.
        run: pnpm build

      - name: Run the end-to-end suite
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Compose target
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No pnpm setup: this job builds and runs the shipped image, so anything
      # it needs from the repository has to be in the image already. Installing
      # the workspace here would hide a missing COPY in the Dockerfile.
      - name: Build the image
        run: docker build -f deploy/docker/Dockerfile -t openokr:ci .

      - name: Boot compose and drive the wizard
        # Proves the acceptance criterion end to end: a clean server reaches a
        # secured instance with an admin, inside the budget, and an upgrade
        # re-runs migrations without damage.
        run: OPENOKR_IMAGE=openokr:ci sh deploy/docker/smoke-test.sh

      - name: Show the logs on failure
        if: failure()
        run: |
          cd deploy/docker
          docker compose -p openokr logs --tail=200 || true

  helm:
    name: Helm chart
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: Chart checks
        # Behaviour, not parsing: what the chart refuses, where migrations
        # run, and that no credential lands in a pod spec.
        run: sh deploy/helm/check.sh

      - name: Build the image
        run: docker build -f deploy/docker/Dockerfile -t openokr:ci .

      - name: Create a cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: openokr-test
          wait: 120s

      - name: Load the image into the cluster
        # No registry involved: the cluster runs the image this commit built.
        run: kind load docker-image openokr:ci --name openokr-test

      - name: Install the chart and use it
        # Installs, waits for readiness, registers a user, then upgrades and
        # checks the encryption key survived.
        run: OPENOKR_IMAGE_TAG=ci sh deploy/helm/cluster-test.sh

  flakiness:
    name: Flakiness report
    needs: [scope, test]
    if: always() && needs.scope.outputs.code == 'true' && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Download shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: flaky-report-*
          path: .flaky
          merge-multiple: true

      - name: Merge reports and gate
        # Writes the merged report to the run summary. Fails only on tests that
        # failed outright and are not quarantined.
        run: pnpm flaky merge .flaky/report-*.json

      - name: List quarantine candidates
        if: always()
        run: |
          pnpm flaky quarantine
          if ! git diff --quiet -- test-quarantine.json; then
            echo "::warning::New flaky tests detected. Run 'pnpm flaky quarantine' and commit test-quarantine.json, or fix the tests."
            git --no-pager diff -- test-quarantine.json
          fi

  build:
    name: Build
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Build (affected only)
        run: pnpm turbo run build --affected

  compliance:
    name: Licences and sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Dependency licence gate
        run: pnpm check:licences

      - name: Commit sign-off gate
        # Bots do not sign off; their commits are covered by the maintainer who
        # merges them.
        if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
        run: pnpm check:signoff origin/${{ github.base_ref }} HEAD

  # One required check to protect the branch with, so the shard count and the
  # documentation-only skip can change without touching branch protection.
  ci:
    name: CI
    needs: [scope, quality, test, e2e, deploy, helm, flakiness, build, compliance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          RESULTS="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job did not pass."
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
